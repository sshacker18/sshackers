name: Battery Brain Android CI

on:
  push:
    paths:
      - "android/BatteryBrain/**"
      - "tools/battery_analyzer.py"
      - "tests/test_battery_analyzer.py"
      - ".github/workflows/battery-brain-android.yml"
  pull_request:
    paths:
      - "android/BatteryBrain/**"
      - "tools/battery_analyzer.py"
      - "tests/test_battery_analyzer.py"
      - ".github/workflows/battery-brain-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test battery analyzer
        run: python -m unittest discover -s tests -v

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android/BatteryBrain
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-brain-debug-apk
          path: android/BatteryBrain/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
